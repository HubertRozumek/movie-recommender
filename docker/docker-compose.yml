services:
  # Main application (Gradio UI)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: movielens-app
    ports:
      - "7860:7860"  # Gradio UI
    volumes:
      - ../data:/app/data
      - ../results:/app/results
      - ../logs:/app/logs
      - ../experiments:/app/experiments
    environment:
      - APP_ENV=production
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mlflow
      - redis
    networks:
      - movielens-network
    restart: unless-stopped

  # MLflow tracking server
  mlflow:
    image: python:3.9-slim
    container_name: movielens-mlflow
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    ports:
      - "5001:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
    depends_on:
      - postgres
    networks:
      - movielens-network
    restart: unless-stopped

  # PostgreSQL database for MLflow
  postgres:
    image: postgres:14-alpine
    container_name: movielens-postgres
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - movielens-network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: movielens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - movielens-network
    restart: unless-stopped

  # Jupyter notebook for development
  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: movielens-jupyter
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    ports:
      - "8888:8888"
    volumes:
      - ../:/app
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - movielens-network
    profiles:
      - development

  # API service (FastAPI)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: movielens-api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../results:/app/results
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - movielens-network
    profiles:
      - api

  # Model training service
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: movielens-trainer
    command: python scripts/train_all_models.py --all
    volumes:
      - ../data:/app/data
      - ../results:/app/results
      - ../experiments:/app/experiments
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - movielens-network
    profiles:
      - training

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: movielens-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - app
      - mlflow
    networks:
      - movielens-network
    profiles:
      - production

networks:
  movielens-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mlflow-artifacts:
  nginx-certs: